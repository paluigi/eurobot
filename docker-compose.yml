# eurobot — default Docker Compose setup
#
# Prerequisites (see README for details):
#   1. .env              — API keys + zzboard endpoint (cp .env.example .env)
#   2. ./config/llm-pycascade.toml — LLM cascade config
#                          (cp config/llm-pycascade.toml.example ...)
#   3. ./data/posts/     — created automatically by Docker if missing
#
# Data layout:
#   - SQLite DBs + log  → named volume `eurobot_data` (managed by Docker)
#   - Audit post JSONs  → bind-mounted ./data/posts (inspect on the host)
#   - LLM config        → bind-mounted ./config (read-only)
#
# The container schedules itself with APScheduler (08:00/13:00/18:00 UTC;
# override via SCHEDULE_HOURS, immediate first run via RUN_ON_START=1).

services:
  eurobot:
    image: paluigi/eurobot:latest   # pinned alternative: paluigi/eurobot:0.1.3
    container_name: eurobot
    env_file: .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./config:/app/config:ro      # llm-pycascade.toml (required)
      - eurobot_data:/app/data       # SQLite DBs + eurobot.log (Docker volume)
      - ./data/posts:/app/data/posts # published payload audit JSONs (host dir)
    restart: unless-stopped

volumes:
  eurobot_data:
